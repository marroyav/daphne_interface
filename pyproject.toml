
[project]
name = "daphne-daq"
version = "0.1.0"
dependencies = [
  "typer[rich]>=0.15",      # or typer[standard]
  "tqdm",
  "numpy",
  "matplotlib",
]
requires-python = ">=3.10"

[project.scripts]
daphne = "daphne_app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daphne_app"]

[tool.hatch.build.targets.sdist]          # optional but nice
include = ["daphne_app/**", "pyproject.toml", "README.md"]


[project.optional-dependencies]
viz = ["plotly>=5.18"]
